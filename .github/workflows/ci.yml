name: Microservices CI

on:
  push:
    branches:
      - security_refactor
  pull_request:
    branches:
      - security_refactor

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - eureka
          - api-gateway
          - user-service
          - product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build service without testing
        run: mvn clean package -DskipTests
        working-directory: ${{matrix.service}}