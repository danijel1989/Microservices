name: Microservices CI

on:
  push:
    branches:
      - security_refactor
  pull_request:
    branches:
      - security_refactor

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: eureka
            image: eureka-server
          - service: api-gateway
            image: api-gateway
          - service: user-service
            image: user-service
          - service: product-service
            image: product-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build service without testing
        run: mvn clean package -DskipTests
        working-directory: ${{matrix.service}}

      - name: Build Docker image
        run: docker build -t ${{matrix.image }} .
        working-directory: ${{matrix.service }}

      - name: Log in to Github Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image for GHCR
        if: github.event_name == 'push'
        run: docker tag ${{ matrix.image }} ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

      - name: Push DOcker image to GHCR
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest